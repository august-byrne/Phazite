# Phazite's continuous integration: on every push and pull request, check the repository (secrets,
# formatting, whitespace, architecture budgets), build every preset on Windows and Linux with warnings
# as errors, and run the tests (phazite_tests, through CTest, a test file in each, 4 at once); and build the Windows
# installer from windows-release, install it, check it and uninstall it. The problem matchers in
# .github/problem-matchers turn compiler messages, failed tests and sanitizer reports into annotations on the run,
# which the public API serves without signing in, unlike the logs. Builds keep going after
# a failure (ninja -k 0) to report every problem at once. Every compile goes through ccache, whose cache each preset
# keeps from its last run on the branch (or on main), so that a build compiles only what changed since. Actions are
# pinned to full commit hashes, so a moved tag can't change what runs.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency: # a newer push to the same branch cancels the run that is still going
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history; the architecture check compares with earlier commits

      - name: Secrets (gitleaks 8.30.1, whole history)
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --no-color --verbose

      - name: Formatting (clang-format 23.1.3)
        run: |
          pipx install clang-format==23.1.3
          CLANG_FORMAT="${PIPX_BIN_DIR:-$HOME/.local/bin}/clang-format" sh tools/format.sh --check

      - name: Whitespace and conflict markers
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Architecture budgets
        env:
          PHAZITE_CI_BASES: ${{ github.event.pull_request.base.sha }} ${{ github.event.before }}
        run: |
          dash -n tools/check-architecture.sh
          AWK=mawk dash tools/check-architecture.sh --ci

      # A reader written from docs/versions-format.md alone, with nothing of Phazite's, lists the test vectors' pack as
      # Phazite's own reader does (tests/GoldenFormatTests.cpp): the specification stays true to what Phazite writes.
      - name: Versions format (an outside reader)
        run: |
          perl tools/read-versions.pl tests/golden/format/song.pack > "$RUNNER_TEMP/song.txt"
          diff -u tests/golden/format/song.txt "$RUNNER_TEMP/song.txt"

  windows:
    name: Windows (${{ matrix.preset }})
    runs-on: windows-2025-vs2026 # Visual Studio 2026, which cmake/toolchains/windows-msvc.cmake requires
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-debug, windows-release]
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache # every compile, JUCE's juceaide helper's in the configure step too
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DEPEND: "true" # a miss compiles at once, without a run of the preprocessor first
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.preset }}-

      - name: Compiler cache (ccache 4.14.2)
        run: |
          $zip = "$env:RUNNER_TEMP\ccache.zip"
          Invoke-WebRequest https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-windows-x86_64.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84") {
              throw "The ccache download doesn't have the SHA-256 it should."
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\ccache-4.14.2-windows-x86_64" >> $env:GITHUB_PATH
          "CCACHE_DIR=$env:RUNNER_TEMP\ccache" >> $env:GITHUB_ENV
          "PHAZITE_CCACHE_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          & "$env:RUNNER_TEMP\ccache-4.14.2-windows-x86_64\ccache.exe" --dir "$env:RUNNER_TEMP\ccache" --zero-stats

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_LINK_WARNING_AS_ERROR=ON

      - name: Build
        run: |
          echo "::add-matcher::.github/problem-matchers/msvc.json"
          cmake --build --preset ${{ matrix.preset }} -- -k 0

      # What this run's compiles didn't use goes (a hit renews an entry's time), so that the cache kept is one build's.
      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: |
          ccache --evict-older-than "$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long] $env:PHAZITE_CCACHE_START)s"
          ccache --show-stats

      - name: Save the compiler cache # before the tests, so that the next run has it whatever they find
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test
        run: |
          echo "::add-matcher::.github/problem-matchers/tests.json"
          ctest --preset ${{ matrix.preset }}

      # The installer, built with the image's Inno Setup, then installed for the runner's user, checked and uninstalled
      # (tools/test-installer.ps1, whose last line says what it found).
      - name: Installer
        if: matrix.preset == 'windows-release'
        run: |
          cmake --build --preset windows-release --target installer
          $installer = Get-ChildItem build\windows-release\installer\Phazite-*-Setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "The installer target made no installer." }
          Get-Content "$($installer.FullName).sha256"
          & tools\test-installer.ps1 -Installer $installer.FullName

  linux:
    name: Linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-release, linux-asan, linux-tsan]
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache # every compile, JUCE's juceaide helper's in the configure step too
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DEPEND: "true" # a miss compiles at once, without a run of the preprocessor first
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.preset }}-

      - name: Compiler cache (ccache 4.14.2)
        run: |
          curl -fsSLo "$RUNNER_TEMP/ccache.tar.xz" https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-linux-x86_64-glibc.tar.xz
          echo "bd1313f5316f594443dcb4113a4191c666ac6450e0cf016ff8cb8b080f46c160  $RUNNER_TEMP/ccache.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-linux-x86_64-glibc" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          echo "PHAZITE_CCACHE_START=$(date +%s)" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ccache-4.14.2-linux-x86_64-glibc/ccache" --dir "$RUNNER_TEMP/ccache" --zero-stats

      - name: Install JUCE's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libfreetype-dev \
              libfontconfig-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          cmake --build --preset ${{ matrix.preset }} -- -k 0

      # What this run's compiles didn't use goes (a hit renews an entry's time), so that the cache kept is one build's.
      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: |
          ccache --evict-older-than "$(( $(date +%s) - PHAZITE_CCACHE_START ))s"
          ccache --show-stats

      - name: Save the compiler cache # before the tests, so that the next run has it whatever they find
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub's Ubuntu 24.04 runners randomise memory mappings with 32 bits of entropy, which the
      # sanitizer runtimes of GCC 13 can't handle ("unexpected memory mapping"); 28 bits works.
      - name: Allow the sanitizers' memory layout
        if: matrix.preset == 'linux-asan' || matrix.preset == 'linux-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Test
        shell: bash # with pipefail: the step fails when the tests do
        run: |
          echo "::add-matcher::.github/problem-matchers/tests.json"
          ctest --preset ${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/tests.log"

      # Each sanitizer report whole, every frame of every stack, as one annotation: the API serves annotations without a
      # login, unlike the log, and the matchers' annotations of single frames stop at ten a step.
      - name: Sanitizer reports
        if: failure() && (matrix.preset == 'linux-asan' || matrix.preset == 'linux-tsan')
        run: sh tools/ci-sanitizer-reports.sh "$RUNNER_TEMP/tests.log"
