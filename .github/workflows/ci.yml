# Phazite's continuous integration: on every push and pull request, check the repository (secrets,
# formatting, whitespace, architecture budgets), build the presets on Windows and Linux with warnings
# as errors, and run the tests (phazite_tests, through CTest, a test file in each, 4 at once); and build the Windows
# installer from windows-release, install it, check it and uninstall it. The problem matchers in
# .github/problem-matchers turn compiler messages, failed tests and sanitizer reports into annotations on the run,
# which the public API serves without signing in, unlike the logs. Builds keep going after
# a failure (ninja -k 0) to report every problem at once.
#
# Which presets: main, tags, pull requests and a run started by hand with full=true build every preset. A work branch
# builds only what a contributor's own windows-debug build doesn't already check: windows-release (the optimizer, the
# installer), linux-release (GCC's warnings with optimization), linux-asan (GCC at Debug, with AddressSanitizer),
# linux-tsan and linux-clang; windows-debug, windows-profile and linux-debug wait for main. Before main moves to a
# branch's head, a full run checks that commit on every preset: gh workflow run ci.yml --ref <branch> -f full=true.
#
# Every compile goes through ccache, whose cache each preset keeps from its last run on the branch (or on main), so that
# a build compiles only what changed since. GitHub keeps 10 GB of caches for the repository and deletes the least
# recently used beyond that, which made builds start from nothing: so a work branch saves the caches of its own presets
# alone (about 1.9 GB, against main's 4.2), pull requests and tags save none (they start from main's), and a deleted
# branch's caches go with it (caches.yml). Without
# precompiled headers (PHAZITE_PRECOMPILED_HEADERS=OFF), which ccache documents no support for with MSVC and serves from
# GCC only with its checks loosened, and so that every push shows each file compiles with what it includes itself. Actions
# are pinned to full commit hashes, so a moved tag can't change what runs.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Every preset, as on main (a work branch otherwise builds the presets local builds don't check)"
        type: boolean
        default: false

permissions:
  contents: read

# A test case that runs this long says its name (and its stack, on Windows) every so many seconds: a test file that hangs
# is ended at ctest's limit with nothing said of where it was (tests/StallReport.h).
env:
  PHAZITE_TEST_STALL_SECONDS: "300"

concurrency: # a newer push to the same branch cancels the run that is still going
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # a few minutes as a rule; a hang ends here rather than at GitHub's six hours
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history; the architecture check compares with earlier commits

      - name: Secrets (gitleaks 8.30.1, whole history)
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --no-color --verbose

      - name: Formatting (clang-format 23.1.3)
        run: |
          pipx install clang-format==23.1.3
          CLANG_FORMAT="${PIPX_BIN_DIR:-$HOME/.local/bin}/clang-format" sh tools/format.sh --check

      - name: Whitespace and conflict markers
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Architecture budgets
        env:
          PHAZITE_CI_BASES: ${{ github.event.pull_request.base.sha }} ${{ github.event.before }}
        run: |
          dash -n tools/check-architecture.sh
          AWK=mawk dash tools/check-architecture.sh --ci

      # A release is the tag v<version>, where <version> is what CMakeLists.txt's project() gives the app, its installer and
      # the update file, which names the installer by its address in the release v<version> (cmake/WriteUpdateFile.cmake):
      # a tag that says another version would publish an update that points nowhere, so it fails here.
      - name: The tag and the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^project(Phazite VERSION \([0-9][0-9.]*\)[ )].*/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then
            echo "::error file=CMakeLists.txt::No project(Phazite VERSION ...) line found."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error file=CMakeLists.txt::The tag $GITHUB_REF_NAME isn't v$version, the version CMakeLists.txt builds."
            exit 1
          fi
          echo "The tag $GITHUB_REF_NAME is the version CMakeLists.txt builds."

      # A reader written from docs/versions-format.md alone, with nothing of Phazite's, lists the test vectors' pack as
      # Phazite's own reader does (tests/GoldenFormatTests.cpp): the specification stays true to what Phazite writes.
      - name: Versions format (an outside reader)
        run: |
          perl tools/read-versions.pl tests/golden/format/song.pack > "$RUNNER_TEMP/song.txt"
          diff -u tests/golden/format/song.txt "$RUNNER_TEMP/song.txt"

  windows:
    name: Windows (${{ matrix.preset }})
    runs-on: windows-2025-vs2026 # Visual Studio 2026, which cmake/toolchains/windows-msvc.cmake requires
    # A build without the compiler cache and the tests take about an hour at most; a hang ends here.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # windows-profile, the build to play and profile with, has compiler and linker flags of its own (CMakeLists.txt).
        # On a work branch windows-release alone (see the top of this file).
        preset: ${{ fromJSON((github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.full) && '["windows-debug", "windows-release", "windows-profile"]' || '["windows-release"]') }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache # every compile, JUCE's juceaide helper's in the configure step too
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DEPEND: "true" # a miss compiles at once, without a run of the preprocessor first
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.preset }}-

      - name: Compiler cache (ccache 4.14.2)
        run: |
          $zip = "$env:RUNNER_TEMP\ccache.zip"
          Invoke-WebRequest https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-windows-x86_64.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84") {
              throw "The ccache download doesn't have the SHA-256 it should."
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\ccache-4.14.2-windows-x86_64" >> $env:GITHUB_PATH
          "CCACHE_DIR=$env:RUNNER_TEMP\ccache" >> $env:GITHUB_ENV
          "PHAZITE_CCACHE_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          & "$env:RUNNER_TEMP\ccache-4.14.2-windows-x86_64\ccache.exe" --dir "$env:RUNNER_TEMP\ccache" --zero-stats

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_LINK_WARNING_AS_ERROR=ON -DPHAZITE_PRECOMPILED_HEADERS=OFF

      - name: Build
        run: |
          echo "::add-matcher::.github/problem-matchers/msvc.json"
          cmake --build --preset ${{ matrix.preset }} -- -k 0

      # What this run's compiles didn't use goes (a hit renews an entry's time), so that the cache kept is one build's.
      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: |
          ccache --evict-older-than "$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long] $env:PHAZITE_CCACHE_START)s"
          ccache --show-stats

      # Saved by pushes to branches, of a work branch's own presets only (see the top of this file).
      - name: Save the compiler cache # before the tests, so that the next run has it whatever they find
        if: ${{ !cancelled() && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/') && (github.ref == 'refs/heads/main' || matrix.preset == 'windows-release') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test
        run: |
          echo "::add-matcher::.github/problem-matchers/tests.json"
          ctest --preset ${{ matrix.preset }}

      # The installer, built with the image's Inno Setup, then installed for the runner's user, checked and uninstalled
      # (tools/test-installer.ps1, whose last line says what it found).
      - name: Installer
        if: matrix.preset == 'windows-release'
        run: |
          cmake --build --preset windows-release --target installer
          $installer = Get-ChildItem build\windows-release\installer\Phazite-*-Setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "The installer target made no installer." }
          Get-Content "$($installer.FullName).sha256"
          & tools\test-installer.ps1 -Installer $installer.FullName

  linux:
    name: Linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    # The sanitizers' builds play the tests several times slower than the others; a hang ends here.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # On a work branch linux-debug waits for main: linux-asan is a Debug build with GCC too (see the top of this file).
        preset: ${{ fromJSON((github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.full) && '["linux-debug", "linux-release", "linux-asan", "linux-tsan"]' || '["linux-release", "linux-asan", "linux-tsan"]') }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache # every compile, JUCE's juceaide helper's in the configure step too
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DEPEND: "true" # a miss compiles at once, without a run of the preprocessor first
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.preset }}-

      - name: Compiler cache (ccache 4.14.2)
        run: |
          curl -fsSLo "$RUNNER_TEMP/ccache.tar.xz" https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-linux-x86_64-glibc.tar.xz
          echo "bd1313f5316f594443dcb4113a4191c666ac6450e0cf016ff8cb8b080f46c160  $RUNNER_TEMP/ccache.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-linux-x86_64-glibc" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          echo "PHAZITE_CCACHE_START=$(date +%s)" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ccache-4.14.2-linux-x86_64-glibc/ccache" --dir "$RUNNER_TEMP/ccache" --zero-stats

      - name: Install JUCE's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libfreetype-dev \
              libfontconfig-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DPHAZITE_PRECOMPILED_HEADERS=OFF

      - name: Build
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          cmake --build --preset ${{ matrix.preset }} -- -k 0

      # What this run's compiles didn't use goes (a hit renews an entry's time), so that the cache kept is one build's.
      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: |
          ccache --evict-older-than "$(( $(date +%s) - PHAZITE_CCACHE_START ))s"
          ccache --show-stats

      # Saved by pushes to branches, of a work branch's own presets only (see the top of this file).
      - name: Save the compiler cache # before the tests, so that the next run has it whatever they find
        if: ${{ !cancelled() && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/') && (github.ref == 'refs/heads/main' || matrix.preset != 'linux-debug') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub's Ubuntu 24.04 runners randomise memory mappings with 32 bits of entropy, which the
      # sanitizer runtimes of GCC 13 can't handle ("unexpected memory mapping"); 28 bits works.
      - name: Allow the sanitizers' memory layout
        if: matrix.preset == 'linux-asan' || matrix.preset == 'linux-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Test
        shell: bash # with pipefail: the step fails when the tests do
        run: |
          echo "::add-matcher::.github/problem-matchers/tests.json"
          ctest --preset ${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/tests.log"

      # Each sanitizer report whole, every frame of every stack, as one annotation: the API serves annotations without a
      # login, unlike the log, and the matchers' annotations of single frames stop at ten a step. Read from ctest's own log,
      # which keeps what every test wrote, passed or failed: a report from a plug-in's helper process (its stderr is passed
      # on to the test's, src/sandbox/client/Helper.cpp) can come in a test that passes, and fails the job here.
      - name: Sanitizer reports
        if: ${{ !cancelled() && (matrix.preset == 'linux-asan' || matrix.preset == 'linux-tsan') }}
        run: sh tools/ci-sanitizer-reports.sh "build/${{ matrix.preset }}/Testing/Temporary/LastTest.log"

  # Clang, the compiler macOS will build with, and its static analysis: the linux-clang preset, then clang-tidy with the
  # checks .clang-tidy lists over the files of Phazite's own that the push changed (tools/clang-tidy.sh --since; every
  # finding fails the job), then the tests. Over every file it takes more than half an hour on a runner's four
  # processors, with nothing kept from run to run, and set the length of every run: the nightly workflow does that.
  clang:
    name: Linux (linux-clang, clang-tidy)
    runs-on: ubuntu-24.04
    timeout-minutes: 150 # the build without the compiler cache, clang-tidy over every file (a tag's), and the tests
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DEPEND: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-clang-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-linux-clang-

      - name: Compiler cache (ccache 4.14.2)
        run: |
          curl -fsSLo "$RUNNER_TEMP/ccache.tar.xz" https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-linux-x86_64-glibc.tar.xz
          echo "bd1313f5316f594443dcb4113a4191c666ac6450e0cf016ff8cb8b080f46c160  $RUNNER_TEMP/ccache.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-linux-x86_64-glibc" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          echo "PHAZITE_CCACHE_START=$(date +%s)" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ccache-4.14.2-linux-x86_64-glibc/ccache" --dir "$RUNNER_TEMP/ccache" --zero-stats

      # Clang 18 and its clang-tidy are Ubuntu 24.04's (and the runner image's); clang and clang++ are 18 there.
      - name: Install JUCE's Linux build dependencies, Clang and clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libfreetype-dev \
              libfontconfig-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
              clang-18 clang-tidy-18
          clang --version
          clang-tidy-18 --version

      # Clang's warnings show as annotations without failing the build: JUCE's list for Clang is far longer than GCC's (every
      # implicit conversion, every function without a declaration before it), and Phazite's code has never been held to it.
      # GCC's jobs above hold it to theirs.
      - name: Configure
        run: cmake --preset linux-clang

      - name: Build
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          cmake --build --preset linux-clang -- -k 0

      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: |
          ccache --evict-older-than "$(( $(date +%s) - PHAZITE_CCACHE_START ))s"
          ccache --show-stats

      # Saved by pushes to branches only: pull requests and tags start from main's (see the top of this file).
      - name: Save the compiler cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-clang-${{ github.run_id }}-${{ github.run_attempt }}

      # Since main, for a branch or a pull request; since main's head before, for a push to main; and every file where
      # there is nothing to compare with: a tag, a run started by hand, or a history that left main's more than 300
      # commits ago (the checkout holds one commit, so both are fetched that far back).
      - name: clang-tidy (what changed)
        if: ${{ !cancelled() }}
        env:
          PHAZITE_MAIN_BEFORE: ${{ github.event.before }}
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          since=
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            git fetch --no-tags --no-recurse-submodules --depth=300 origin main || true
            since=$PHAZITE_MAIN_BEFORE
          elif [ "$GITHUB_EVENT_NAME" = pull_request ] || { [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; }; then
            git fetch --no-tags --no-recurse-submodules --depth=300 origin main "$GITHUB_SHA" || true
            since=origin/main
          fi
          if [ -n "$since" ] && git merge-base "$since" HEAD > /dev/null 2>&1; then
            CLANG_TIDY=clang-tidy-18 sh tools/clang-tidy.sh build/linux-clang --since "$since"
          else
            echo "Nothing to compare with: clang-tidy over every file."
            CLANG_TIDY=clang-tidy-18 sh tools/clang-tidy.sh build/linux-clang
          fi

      - name: Test
        if: ${{ !cancelled() }}
        run: |
          echo "::add-matcher::.github/problem-matchers/tests.json"
          ctest --preset linux-clang
