# Phazite's continuous integration: on every push and pull request, check the repository (secrets,
# formatting, whitespace) and build every preset on Windows and Linux with warnings as errors. The
# problem matchers in .github/problem-matchers turn compiler messages into annotations on the run.
# Builds keep going after a failure (ninja -k 0) to report every problem at once. Actions are pinned
# to full commit hashes, so a moved tag can't change what runs.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency: # a newer push to the same branch cancels the run that is still going
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Secrets (gitleaks 8.30.1, whole history)
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --no-color --verbose

      - name: Formatting (clang-format 23.1.3)
        run: |
          pipx install clang-format==23.1.3
          CLANG_FORMAT="${PIPX_BIN_DIR:-$HOME/.local/bin}/clang-format" sh tools/format.sh --check

      - name: Whitespace and conflict markers
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  windows:
    name: Windows (${{ matrix.preset }})
    runs-on: windows-2025-vs2026 # Visual Studio 2026, which cmake/toolchains/windows-msvc.cmake requires
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-debug, windows-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # checkout fetches JUCE over HTTPS, though Tracktion lists it with an SSH URL

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_LINK_WARNING_AS_ERROR=ON

      - name: Build
        run: |
          echo "::add-matcher::.github/problem-matchers/msvc.json"
          cmake --build --preset ${{ matrix.preset }} -- -k 0

  linux:
    name: Linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-release, linux-asan, linux-tsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install JUCE's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libfreetype-dev \
              libfontconfig-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          cmake --build --preset ${{ matrix.preset }} -- -k 0
